name: Convert BibTeX to HTML List

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install bibtex2html
        run: |
          sudo apt-get update
          sudo apt-get install -y bibtex2html

      - name: Fetch and Convert BibTeX
        run: |
          # 1. Download the BibTeX file
          curl -sL -A "Mozilla/5.0" "https://www.dynsyslab.org/wp-content/papercite-data/bib/schoellig-library.bib" -o library.bib

          # 2. Convert BibTeX to HTML list (-i ignores parsing errors in bad entries)
          bibtex2html -i -a -d -nodoc -dl library.bib

          # 3. Rename generated output file to index.html
          mv library.html index.html

      - name: Commit and Push HTML
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-update publications HTML" || exit 0
          git push
