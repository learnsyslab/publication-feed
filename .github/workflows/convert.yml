name: Convert BibTeX to HTML List

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Pandoc & BibTool
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc bibtool

      - name: Fetch, Sanitize, and Convert BibTeX
        run: |
          # 1. Download raw BibTeX file
          curl -sL -A "Mozilla/5.0" "https://www.dynsyslab.org/wp-content/papercite-data/bib/schoellig-library.bib" -o raw_library.bib

          # 2. Sanitize and repair BibTeX syntax errors
          bibtool -r keep.stuff -i raw_library.bib -o clean_library.bib || true

          # 3. Create a markdown file referencing all entries
          echo '---' > refs.md
          echo 'bibliography: clean_library.bib' >> refs.md
          echo 'nocite: "@*"' >> refs.md
          echo '---' >> refs.md
          echo '# Publications' >> refs.md

          # 4. Convert to HTML using Pandoc's built-in citeproc
          pandoc refs.md --citeproc -t html -o index.html

      - name: Commit and Push HTML
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-update publications HTML" || exit 0
          git push
