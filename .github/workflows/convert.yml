name: Convert BibTeX to HTML List

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install bibtexparser

      - name: Fetch and Convert BibTeX
        run: |
          cat << 'EOF' > convert.py
          import urllib.request
          import bibtexparser
          from collections import defaultdict

          url = "https://www.dynsyslab.org/wp-content/papercite-data/bib/schoellig-library.bib"
          
          # Custom parser configuration to ignore common LaTeX bib errors
          parser = bibtexparser.bparser.BibTexParser(common_strings=True, ignore_errors=True)
          
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(req) as response:
              bib_content = response.read().decode('utf-8', errors='ignore')

          bib_database = bibtexparser.loads(bib_content, parser=parser)

          by_year = defaultdict(list)
          for entry in bib_database.entries:
              year = entry.get("year", "Other")
              by_year[year].append(entry)

          with open("index.html", "w", encoding="utf-8") as f:
              f.write('<div class="publications-container">\n')
              for year in sorted(by_year.keys(), reverse=True):
                  f.write(f'  <h3>{year}</h3>\n  <ul class="publication-list">\n')
                  for entry in by_year[year]:
                      author = entry.get("author", "Unknown").replace("\n", " ")
                      title = entry.get("title", "Untitled").replace("{", "").replace("}", "")
                      venue = entry.get("journal", entry.get("booktitle", ""))
                      link = entry.get("url", entry.get("doi", ""))
                      
                      title_html = f'<a href="{link}">{title}</a>' if link else title
                      venue_html = f' — <em>{venue}</em>' if venue else ""
                      
                      f.write(f'    <li><strong>{title_html}</strong><br/>{author}{venue_html}</li>\n')
                  f.write('  </ul>\n')
              f.write('</div>\n')
          EOF
          python convert.py

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        if: success()
