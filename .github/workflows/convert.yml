name: Convert BibTeX to HTML List

on:
  schedule:
    # Every day at 04:17 UTC. Off-the-hour times are less likely to be
    # queued behind the crowd of jobs scheduled on the hour.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bibtool

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install "bibtexparser<2.0.0"

      - name: Fetch, Clean, and Sort BibTeX
        run: |
          # Download the raw library and bail out if the fetch clearly failed,
          # so a bad day upstream never wipes the published page.
          curl -sL -A "Mozilla/5.0" "https://www.dynsyslab.org/wp-content/papercite-data/bib/schoellig-library.bib" -o raw_library.bib
          if [ ! -s raw_library.bib ] || [ "$(wc -c < raw_library.bib)" -lt 10000 ]; then
            echo "Downloaded .bib looks empty or truncated - keeping the existing index.html."
            exit 1
          fi

          # Pre-clean raw file using bibtool to prevent syntax crashes
          bibtool -r keep.stuff -i raw_library.bib -o clean_library.bib || true
          if [ ! -s clean_library.bib ]; then
            cp raw_library.bib clean_library.bib
          fi

          cat << 'EOF' > parse_bib.py
          import bibtexparser
          from bibtexparser.bparser import BibTexParser
          from bibtexparser.customization import convert_to_unicode
          from collections import defaultdict
          from datetime import date
          from html import escape
          import re

          # ----------------------------------------------------------------------
          # Settings
          # ----------------------------------------------------------------------
          HIGHLIGHT = []        # surnames to bold in author lists; empty = nobody
          # Separator drawn before each year heading (the first year never gets one):
          #   "space"  <p>&nbsp;</p>      extra whitespace; always renders, nothing to strip
          #   "hr"     <hr>               semantic, but some themes render it invisibly
          #   "rule"   <p>&#8212;...</p>  a literal line of em dashes; crude but unmissable
          #   "none"   nothing            let the <h2> heading do the separating
          YEAR_DIVIDER = "space"
          LINK_TITLES = True    # wrap the title in <a> when a whitelisted URL is available
          LINK_BLANK = False    # add target="_blank" (more attributes = more to be stripped)
          SHOW_DOI = False      # also print "DOI: ..." as plain text under the entry
          SHOW_META = True      # "213 publications, updated ..." line at the top
          LIST_TAG = "ol"       # "ol" for numbered entries, "ul" for bullets
          USE_SMALL = True      # wrap the DOI line in <small>
          ASCII_ONLY = True     # emit accents as &#nnn; so encoding can never break
          INPUT_FILE = "clean_library.bib"
          OUTPUT_FILE = "index.html"

          # Section headings, in the order they should appear inside each year
          TYPE_ORDER = [
              ("article", "Journal Articles"),
              ("inproceedings", "Conference Papers"),
              ("incollection", "Book Chapters"),
              ("book", "Books"),
              ("techreport", "Preprints and Submitted Work"),
              ("phdthesis", "Theses"),
              ("mastersthesis", "Theses"),
              ("misc", "Talks, Posters and Videos"),
          ]
          TYPE_LABEL = dict(TYPE_ORDER)
          TYPE_RANK = {t: i for i, (t, _) in enumerate(TYPE_ORDER)}


          # ----------------------------------------------------------------------
          # Text helpers
          # ----------------------------------------------------------------------
          def esc(text):
              """Escape HTML, then optionally reduce to pure ASCII entities."""
              text = escape(text, quote=False)
              if ASCII_ONLY:
                  text = "".join(c if ord(c) < 128 else "&#%d;" % ord(c) for c in text)
              return text


          def clean_text(text):
              if not text:
                  return ""
              text = re.sub(r"[{}]", "", text)
              text = text.replace("\\&", "&").replace("\\%", "%").replace("\\_", "_")
              text = text.replace("~", " ")
              text = text.replace("---", "\u2014").replace("--", "\u2013")
              text = re.sub(r"\s+", " ", text).strip()
              return text.strip(" .,")


          def fmt_authors(raw):
              raw = clean_text(raw)
              if not raw:
                  return ""
              names = []
              for name in re.split(r"\s+and\s+", raw):
                  name = name.strip().rstrip("*")
                  if not name:
                      continue
                  if "," in name:  # "Schoellig, Angela P." -> "Angela P. Schoellig"
                      last, first = name.split(",", 1)
                      name = f"{first.strip()} {last.strip()}".strip()
                  if any(h.lower() in name.lower() for h in HIGHLIGHT):
                      names.append("<strong>%s</strong>" % esc(name))
                  else:
                      names.append(esc(name))
              if len(names) == 1:
                  return names[0]
              if len(names) == 2:
                  return " and ".join(names)
              return ", ".join(names[:-1]) + ", and " + names[-1]


          def build_venue(entry, etype):
              """Just the venue name: no volume, number, pages or publisher."""
              if etype == "article":
                  main = clean_text(entry.get("journal", ""))
              elif etype in ("inproceedings", "incollection"):
                  main = clean_text(entry.get("booktitle", ""))
              elif etype == "techreport":
                  main = (clean_text(entry.get("journal", ""))
                          or clean_text(entry.get("booktitle", ""))
                          or clean_text(entry.get("institution", "")))
              elif etype in ("phdthesis", "mastersthesis"):
                  kind = "PhD thesis" if etype == "phdthesis" else "Master's thesis"
                  school = clean_text(entry.get("school", "")) or clean_text(entry.get("institution", ""))
                  main = f"{kind}, {school}" if school else kind
              elif etype == "book":
                  main = clean_text(entry.get("publisher", "")) or clean_text(entry.get("series", ""))
              else:
                  main = clean_text(entry.get("howpublished", "")) or clean_text(entry.get("booktitle", ""))

              return "<em>%s</em>" % esc(main) if main else ""


          # ----------------------------------------------------------------------
          # Link resolution: only these hosts are ever emitted
          # ----------------------------------------------------------------------
          ALLOWED_HOSTS = ("doi.org", "arxiv.org", "sciencedirect.com")

          # url* fields worth inspecting, best first. urlvideo/urlcode/urlslides are
          # deliberately absent: they point at YouTube, GitHub, tiny.cc and the like.
          URL_FIELDS = ["url", "urllink", "urllink2", "urlabstract", "eprint"]


          def normalize_doi(raw):
              doi = clean_text(raw)
              doi = re.sub(r"^\s*(doi:)?\s*", "", doi, flags=re.I)
              doi = re.sub(r"^https?://(dx\.)?doi\.org/", "", doi, flags=re.I)
              doi = doi.strip().rstrip(".,;")
              return doi if doi.lower().startswith("10.") else ""


          def host_of(url):
              m = re.match(r"https?://([^/?#]+)", url.strip(), flags=re.I)
              return re.sub(r"^www\.", "", m.group(1).lower()) if m else ""


          def normalize_arxiv(url):
              """https://arxiv.org/pdf/2409.11171v2.pdf -> https://arxiv.org/abs/2409.11171v2"""
              m = re.search(r"arxiv\.org/(?:abs|pdf)/([^\s?#]+)", url, flags=re.I)
              if not m:
                  return ""
              ident = m.group(1).rstrip("/")
              ident = re.sub(r"\.pdf$", "", ident, flags=re.I)
              return "https://arxiv.org/abs/" + ident


          def pick_link(entry):
              """Return a single URL on an allowed host, or "" if there is none."""
              doi = normalize_doi(entry.get("doi", ""))
              if doi:
                  return "https://doi.org/" + doi

              urls = []
              for field in URL_FIELDS:
                  for key in (field, field.upper()):
                      val = (entry.get(key) or "").strip()
                      if val:
                          urls.append(val)
              # anything else that looks like a link field, checked last
              for key, val in entry.items():
                  k = key.lower()
                  if k.startswith("url") and k not in URL_FIELDS and isinstance(val, str):
                      urls.append(val.strip())

              for url in urls:  # a DOI hiding inside a url field
                  if "doi.org" in url.lower():
                      doi = normalize_doi(url)
                      if doi:
                          return "https://doi.org/" + doi
              for url in urls:
                  if "arxiv.org" in url.lower():
                      link = normalize_arxiv(url)
                      if link:
                          return link
              for url in urls:
                  if "sciencedirect.com" in url.lower():
                      return url.split()[0]

              eprint = clean_text(entry.get("eprint", ""))
              if re.fullmatch(r"\d{4}\.\d{4,5}(v\d+)?", eprint):
                  return "https://arxiv.org/abs/" + eprint

              return ""


          def safe_link(url):
              """Final guard: https only, and only on an allowed host."""
              if not url or not url.lower().startswith("https://"):
                  return ""
              host = host_of(url)
              if not any(host == d or host.endswith("." + d) for d in ALLOWED_HOSTS):
                  return ""
              return escape(url, quote=True)


          def year_key(y):
              m = re.search(r"\d{4}", y or "")
              return int(m.group()) if m else -1


          # ----------------------------------------------------------------------
          # Parse
          # ----------------------------------------------------------------------
          with open(INPUT_FILE, "r", encoding="utf-8", errors="ignore") as f:
              bib_text = f.read()

          parser = BibTexParser(common_strings=True)
          parser.customization = convert_to_unicode
          parser.ignore_nonstandard_types = False
          bib_db = bibtexparser.loads(bib_text, parser=parser)

          by_year = defaultdict(lambda: defaultdict(list))
          unlinked = []
          total = 0
          for entry in bib_db.entries:
              etype = entry.get("ENTRYTYPE", "misc").lower()
              if etype not in TYPE_RANK:
                  etype = "misc"
              year = clean_text(entry.get("year", "")) or "Undated"
              by_year[year][etype].append(entry)
              total += 1

          # ----------------------------------------------------------------------
          # Render: raw semantic HTML only.
          # No <style>, no style attributes, no classes, no ids.
          # The only links are doi.org / arxiv.org / sciencedirect.com on the title.
          # Tags used: h2, h3, hr, ol/ul, li, p, a, strong, em, small, br
          # ----------------------------------------------------------------------
          with open(OUTPUT_FILE, "w", encoding="utf-8") as f:

              if SHOW_META:
                  line = "%d publications, updated %s" % (total, date.today().strftime("%d %B %Y"))
                  f.write("<p>%s</p>\n" % (("<small>%s</small>" % esc(line)) if USE_SMALL else esc(line)))

              for n, year in enumerate(sorted(by_year.keys(), key=year_key, reverse=True)):
                  if n:
                      if YEAR_DIVIDER == "hr":
                          f.write("\n<hr>\n")
                      elif YEAR_DIVIDER == "space":
                          f.write("\n<p>&nbsp;</p>\n")
                      elif YEAR_DIVIDER == "rule":
                          f.write("\n<p>%s</p>\n" % ("&#8212;" * 30))
                  f.write("\n<h2>%s</h2>\n" % esc(year))

                  groups = sorted(by_year[year].items(), key=lambda kv: TYPE_RANK.get(kv[0], 99))
                  merged = []
                  for etype, entries in groups:
                      label = TYPE_LABEL.get(etype, "Other")
                      if merged and merged[-1][0] == label:
                          merged[-1][1].extend(entries)
                      else:
                          merged.append((label, list(entries)))

                  for label, entries in merged:
                      f.write("<h3>%s</h3>\n" % esc(label))
                      f.write("<%s>\n" % LIST_TAG)

                      for entry in entries:
                          etype = entry.get("ENTRYTYPE", "misc").lower()
                          title = esc(clean_text(entry.get("title", "Untitled")))
                          authors = fmt_authors(entry.get("author", "") or entry.get("editor", ""))
                          venue = build_venue(entry, etype)

                          note = clean_text(entry.get("note", ""))
                          if note and len(note) < 120:
                              if any(w in note.lower() for w in ("award", "medal", "prize")):
                                  venue_suffix = " <strong>[%s]</strong>" % esc(note)
                              else:
                                  venue_suffix = " [%s]" % esc(note)
                          else:
                              venue_suffix = ""

                          doi = clean_text(entry.get("doi", ""))
                          if SHOW_DOI and doi:
                              doi = re.sub(r"^https?://(dx\.)?doi\.org/", "", doi)
                              doi_line = "DOI: " + esc(doi)
                              if USE_SMALL:
                                  doi_line = "<small>%s</small>" % doi_line
                          else:
                              doi_line = ""

                          link = safe_link(pick_link(entry)) if LINK_TITLES else ""
                          if link:
                              target = ' target="_blank"' if LINK_BLANK else ""
                              head = '<a href="%s"%s><strong>%s</strong></a>' % (link, target, title)
                          else:
                              head = "<strong>%s</strong>" % title

                          if not link:
                              unlinked.append((entry.get("ID", "?"),
                                               clean_text(entry.get("year", "")),
                                               clean_text(entry.get("title", ""))[:70]))

                          lines = [head]
                          if authors:
                              lines.append(authors)
                          if venue or venue_suffix:
                              lines.append(venue + venue_suffix)
                          if doi_line:
                              lines.append(doi_line)

                          f.write("  <li>%s</li>\n" % "<br>\n      ".join(lines))

                      f.write("</%s>\n" % LIST_TAG)

          print("Wrote %s with %d entries across %d years." % (OUTPUT_FILE, total, len(by_year)))
          print("Linked %d of %d titles; %d have no doi.org / arxiv.org / sciencedirect.com URL."
                % (total - len(unlinked), total, len(unlinked)))
          for key, yr, title in sorted(unlinked, key=lambda r: r[1], reverse=True):
              print("  unlinked  %s  %s  %s" % (yr or "????", key, title))
          EOF
          python parse_bib.py

      - name: Commit and Push HTML
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update publication feed" || exit 0
          git push
