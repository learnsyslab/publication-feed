name: Convert BibTeX to HTML List

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bibtool

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install "bibtexparser<2.0.0"

      - name: Fetch, Clean, and Sort BibTeX
        run: |
          # Download the raw library and bail out if the fetch clearly failed,
          # so a bad day upstream never wipes the published page.
          curl -sL -A "Mozilla/5.0" "https://www.dynsyslab.org/wp-content/papercite-data/bib/schoellig-library.bib" -o raw_library.bib
          if [ ! -s raw_library.bib ] || [ "$(wc -c < raw_library.bib)" -lt 10000 ]; then
            echo "Downloaded .bib looks empty or truncated - keeping the existing index.html."
            exit 1
          fi

          # Pre-clean raw file using bibtool to prevent syntax crashes
          bibtool -r keep.stuff -i raw_library.bib -o clean_library.bib || true
          if [ ! -s clean_library.bib ]; then
            cp raw_library.bib clean_library.bib
          fi

          cat << 'EOF' > parse_bib.py
          import bibtexparser
          from bibtexparser.bparser import BibTexParser
          from bibtexparser.customization import convert_to_unicode
          from collections import defaultdict
          from datetime import date
          from html import escape
          import re

          # ----------------------------------------------------------------------
          # Settings
          # ----------------------------------------------------------------------
          HIGHLIGHT = ["Schoellig", "Schollig", "Sch\u00f6llig"]  # bolded in author lists
          SHOW_DOI = True          # DOI shown as plain text (never as a link)
          SHOW_META = True         # "213 publications - updated ..." line at the top
          IMPORTANT = True         # append !important so a strict CMS theme cannot override
          INPUT_FILE = "clean_library.bib"
          OUTPUT_FILE = "index.html"

          # Palette
          INK = "#1c1c1e"
          MUTED = "#5f6368"
          ACCENT = "#0b4f8a"
          RULE = "#e3e5e8"
          FONT = ("-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,"
                  "Helvetica,Arial,sans-serif")

          # Section headings, in the order they should appear inside each year
          TYPE_ORDER = [
              ("article", "Journal Articles"),
              ("inproceedings", "Conference Papers"),
              ("incollection", "Book Chapters"),
              ("book", "Books"),
              ("techreport", "Preprints and Submitted Work"),
              ("phdthesis", "Theses"),
              ("mastersthesis", "Theses"),
              ("misc", "Talks, Posters and Videos"),
          ]
          TYPE_LABEL = dict(TYPE_ORDER)
          TYPE_RANK = {t: i for i, (t, _) in enumerate(TYPE_ORDER)}


          # ----------------------------------------------------------------------
          # Inline-style helper
          # ----------------------------------------------------------------------
          def st(*declarations):
              """Build a style="..." attribute from 'prop:value' strings."""
              out = []
              for d in declarations:
                  d = d.strip().rstrip(";")
                  if not d:
                      continue
                  out.append(d + " !important" if IMPORTANT else d)
              return ' style="%s"' % ";".join(out)


          S_WRAP = st(
              "font-family:" + FONT,
              "color:" + INK,
              "line-height:1.55",
              "font-size:16px",
              "max-width:60em",
              "margin:0",
              "padding:0",
          )
          S_META = st(
              "margin:0 0 2em", "padding:0", "font-size:0.8em", "color:" + MUTED,
              "letter-spacing:0.06em", "text-transform:uppercase",
          )
          S_YEAR = st("margin:0 0 2.4em", "padding:0")
          S_YEAR_H = st(
              "margin:0 0 0.9em", "padding:0 0 0.25em", "font-family:" + FONT,
              "font-size:1.5em", "font-weight:700", "color:" + ACCENT,
              "border:0", "border-bottom:3px solid #d7e2ec", "text-transform:none",
          )
          S_GROUP = st("margin:0 0 1.5em", "padding:0")
          S_GROUP_H = st(
              "margin:0 0 0.6em", "padding:0", "font-family:" + FONT, "font-size:0.78em",
              "font-weight:700", "letter-spacing:0.12em", "text-transform:uppercase",
              "color:" + MUTED, "border:0",
          )
          S_LIST = st("list-style:decimal outside", "margin:0", "padding:0 0 0 2.1em")
          S_ITEM = st(
              "margin:0 0 0.8em", "padding:0 0 0.7em", "border-bottom:1px solid " + RULE,
          )
          S_ITEM_LAST = st("margin:0", "padding:0", "border:0")
          S_TITLE = st("margin:0 0 0.15em", "font-weight:600", "font-size:1.02em")
          S_AUTHORS = st("margin:0 0 0.1em", "font-size:0.94em", "color:#3b3f45")
          S_VENUE = st("margin:0", "font-size:0.92em", "color:" + MUTED)
          S_EXTRA = st("margin:0.35em 0 0", "font-size:0.78em", "color:" + MUTED)
          S_TAG = st(
              "display:inline-block", "margin:0 0.5em 0 0", "padding:0.12em 0.55em",
              "border-radius:3px", "background:#eef2f6", "color:#41586f",
              "font-weight:600", "letter-spacing:0.02em",
          )
          S_TAG_AWARD = st(
              "display:inline-block", "margin:0 0.5em 0 0", "padding:0.12em 0.55em",
              "border-radius:3px", "background:#fdf1dc", "color:#8a5a12",
              "font-weight:600", "letter-spacing:0.02em",
          )
          S_DOI = st("word-break:break-word")


          # ----------------------------------------------------------------------
          # Text helpers
          # ----------------------------------------------------------------------
          def esc(text):
              return escape(text, quote=False)


          def clean_text(text):
              if not text:
                  return ""
              text = re.sub(r"[{}]", "", text)
              text = text.replace("\\&", "&").replace("\\%", "%").replace("\\_", "_")
              text = text.replace("~", " ")
              text = text.replace("---", "\u2014").replace("--", "\u2013")
              text = re.sub(r"\s+", " ", text).strip()
              return text.strip(" .,")


          def fmt_authors(raw):
              raw = clean_text(raw)
              if not raw:
                  return ""
              names = []
              for name in re.split(r"\s+and\s+", raw):
                  name = name.strip().rstrip("*")
                  if not name:
                      continue
                  if "," in name:  # "Schoellig, Angela P." -> "Angela P. Schoellig"
                      last, first = name.split(",", 1)
                      name = f"{first.strip()} {last.strip()}".strip()
                  if any(h.lower() in name.lower() for h in HIGHLIGHT):
                      names.append("<strong>%s</strong>" % esc(name))
                  else:
                      names.append(esc(name))
              if len(names) == 1:
                  return names[0]
              if len(names) == 2:
                  return " and ".join(names)
              return ", ".join(names[:-1]) + ", and " + names[-1]


          def fmt_pages(raw):
              pages = clean_text(raw)
              if not pages:
                  return ""
              pages = re.sub(r"\s*[-\u2013\u2014]+\s*", "\u2013", pages)
              return ("pp. " if "\u2013" in pages else "p. ") + pages


          def build_venue(entry, etype):
              """Venue string for an entry, without any links."""
              bits = []
              if etype == "article":
                  main = clean_text(entry.get("journal", ""))
                  vol = clean_text(entry.get("volume", ""))
                  num = clean_text(entry.get("number", ""))
                  if vol:
                      bits.append("vol. " + vol)
                  if num:
                      bits.append("no. " + num)
              elif etype in ("inproceedings", "incollection"):
                  main = clean_text(entry.get("booktitle", ""))
                  pub = clean_text(entry.get("publisher", ""))
                  if pub:
                      bits.append(pub)
              elif etype == "techreport":
                  main = clean_text(entry.get("journal", "")) or clean_text(entry.get("booktitle", ""))
                  inst = clean_text(entry.get("institution", ""))
                  if not main:
                      main = inst
                  elif inst:
                      bits.append(inst)
              elif etype in ("phdthesis", "mastersthesis"):
                  kind = "PhD thesis" if etype == "phdthesis" else "Master's thesis"
                  main = clean_text(entry.get("school", "")) or clean_text(entry.get("institution", ""))
                  main = f"{kind}, {main}" if main else kind
              elif etype == "book":
                  main = clean_text(entry.get("publisher", "")) or clean_text(entry.get("series", ""))
              else:
                  main = clean_text(entry.get("howpublished", "")) or clean_text(entry.get("booktitle", ""))

              pages = fmt_pages(entry.get("pages", ""))
              if pages:
                  bits.append(pages)

              venue = "<em>%s</em>" % esc(main) if main else ""
              tail = ", ".join(esc(b) for b in bits)
              if venue and tail:
                  return venue + ", " + tail
              return venue or tail


          def year_key(y):
              m = re.search(r"\d{4}", y or "")
              return int(m.group()) if m else -1


          # ----------------------------------------------------------------------
          # Parse
          # ----------------------------------------------------------------------
          with open(INPUT_FILE, "r", encoding="utf-8", errors="ignore") as f:
              bib_text = f.read()

          parser = BibTexParser(common_strings=True)
          parser.customization = convert_to_unicode
          parser.ignore_nonstandard_types = False
          bib_db = bibtexparser.loads(bib_text, parser=parser)

          by_year = defaultdict(lambda: defaultdict(list))
          total = 0
          for entry in bib_db.entries:
              etype = entry.get("ENTRYTYPE", "misc").lower()
              if etype not in TYPE_RANK:
                  etype = "misc"
              year = clean_text(entry.get("year", "")) or "Undated"
              by_year[year][etype].append(entry)
              total += 1

          # ----------------------------------------------------------------------
          # Render: inline styles only, no <style>, no classes, no pseudo-elements
          # ----------------------------------------------------------------------
          with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
              f.write("<div%s>\n" % S_WRAP)

              if SHOW_META:
                  f.write("  <p%s>%d publications &middot; updated %s</p>\n"
                          % (S_META, total, date.today().strftime("%d %B %Y")))

              for year in sorted(by_year.keys(), key=year_key, reverse=True):
                  f.write("  <div%s>\n" % S_YEAR)
                  f.write("    <h2%s>%s</h2>\n" % (S_YEAR_H, esc(year)))

                  groups = sorted(by_year[year].items(), key=lambda kv: TYPE_RANK.get(kv[0], 99))
                  merged = []
                  for etype, entries in groups:
                      label = TYPE_LABEL.get(etype, "Other")
                      if merged and merged[-1][0] == label:
                          merged[-1][1].extend(entries)
                      else:
                          merged.append((label, list(entries)))

                  for label, entries in merged:
                      f.write("    <div%s>\n" % S_GROUP)
                      f.write("      <h3%s>%s</h3>\n" % (S_GROUP_H, esc(label)))
                      f.write("      <ol%s>\n" % S_LIST)

                      for i, entry in enumerate(entries):
                          etype = entry.get("ENTRYTYPE", "misc").lower()
                          title = esc(clean_text(entry.get("title", "Untitled")))
                          authors = fmt_authors(entry.get("author", "") or entry.get("editor", ""))
                          venue = build_venue(entry, etype)

                          extra = []
                          note = clean_text(entry.get("note", ""))
                          if note and len(note) < 120:
                              award = any(w in note.lower() for w in ("award", "medal", "prize"))
                              extra.append("<span%s>%s</span>"
                                           % (S_TAG_AWARD if award else S_TAG, esc(note)))
                          doi = clean_text(entry.get("doi", ""))
                          if SHOW_DOI and doi:
                              doi = re.sub(r"^https?://(dx\.)?doi\.org/", "", doi)
                              extra.append("<span%s>DOI: %s</span>" % (S_DOI, esc(doi)))

                          last = (i == len(entries) - 1)
                          f.write("        <li%s>\n" % (S_ITEM_LAST if last else S_ITEM))
                          f.write("          <div%s>%s</div>\n" % (S_TITLE, title))
                          if authors:
                              f.write("          <div%s>%s</div>\n" % (S_AUTHORS, authors))
                          if venue:
                              f.write("          <div%s>%s</div>\n" % (S_VENUE, venue))
                          if extra:
                              f.write("          <div%s>%s</div>\n" % (S_EXTRA, " ".join(extra)))
                          f.write("        </li>\n")

                      f.write("      </ol>\n")
                      f.write("    </div>\n")
                  f.write("  </div>\n")
              f.write("</div>\n")

          print("Wrote %s with %d entries across %d years." % (OUTPUT_FILE, total, len(by_year)))
          EOF
          python parse_bib.py

      - name: Commit and Push HTML
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update publication feed" || exit 0
          git push
