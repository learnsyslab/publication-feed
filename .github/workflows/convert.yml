name: Convert BibTeX to HTML List

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install bibtex2html
        run: |
          sudo apt-get update
          sudo apt-get install -y bibtex2html

      - name: Fetch and Convert BibTeX
        run: |
          # Fetch the raw .bib file
          curl -sL -A "Mozilla/5.0" "https://www.dynsyslab.org/wp-content/papercite-data/bib/schoellig-library.bib" -o library.bib

          # Convert BibTeX to a clean HTML snippet (no full HTML document wrappers)
          bibtex2html -a -nodoc -dl -citeids -o output library.bib

          # Rename output to index.html
          mv output.html index.html

      - name: Commit and Push HTML
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-update publications HTML" || exit 0
          git push
